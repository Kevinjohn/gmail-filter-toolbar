name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint src tests
      - name: Validate locales
        run: npm run lint:locales
      - name: Unit tests
        run: npm run test:unit
      - name: Build (Chrome + Firefox)
        run: npm run build
      - name: Firefox add-on lint
        run: npm run firefox:lint
