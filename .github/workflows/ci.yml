name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint src tests
      - name: Format check
        run: pnpm run format:check
      - name: Validate locales
        run: pnpm run lint:locales
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build (Chrome + Firefox)
        run: pnpm run build
      - name: Firefox add-on lint
        run: pnpm run firefox:lint
