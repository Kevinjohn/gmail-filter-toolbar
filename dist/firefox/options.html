<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filter Toolbar Options</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="colours.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="gcal-options-page">
    <h1 id="pageTitle"></h1>
    <p id="pageDescription"></p>
    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    <fieldset>
      <legend id="debugLegend"></legend>
      <div class="option-row">
        <label for="debug" id="debugLabel"></label>
        <input type="checkbox" id="debug" />
      </div>
    </fieldset>
    <fieldset>
      <legend id="showButtonTextLegend"></legend>
      <div class="option-row">
        <label for="show-button-text-checkbox" id="showButtonTextLabel"></label>
        <input type="checkbox" id="show-button-text-checkbox" />
      </div>
    </fieldset>
    <fieldset>
      <legend id="alignmentLegend"></legend>
      <div class="option-row">
        <label for="alignment-select" id="alignmentLabel"></label>
        <select id="alignment-select">
          <option id="alignmentOptionStart" value="start"></option>
          <option id="alignmentOptionCenter" value="center" selected></option>
        </select>
      </div>
      <div class="option-row">
        <label for="show-favourites-checkbox" id="showFavouritesLabel"></label>
        <input type="checkbox" id="show-favourites-checkbox" />
      </div>
    </fieldset>
    <fieldset>
      <legend id="themeLegend"></legend>
      <div class="option-row">
        <label for="theme-select" id="themeLabel"></label>
        <select id="theme-select">
          <option id="themeOptionSystem" value="system"></option>
          <option id="themeOptionLight" value="light"></option>
          <option id="themeOptionDark" value="dark"></option>
        </select>
      </div>
    </fieldset>
    <fieldset id="experimental-section">
      <legend data-i18n="experimental_legend">Experimental</legend>
      <p id="experimentalDescription">
        <span data-i18n="experimental_description"
          >Experimental features are in active testing and may only be available in English.</span
        >
      </p>
      <div class="option-row">
        <label for="show-ai-notetakers-checkbox" data-i18n="options_show_ai_notetakers"
          >Show AI & Transcription button</label
        >
        <input type="checkbox" id="show-ai-notetakers-checkbox" />
      </div>
      <div class="option-row">
        <label for="show-dev-notifications-checkbox" data-i18n="options_show_dev_notifications"
          >Show Dev Notifications button</label
        >
        <input type="checkbox" id="show-dev-notifications-checkbox" />
      </div>
    </fieldset>
    <script type="module" src="modules/options.js"></script>
  </body>
</html>
